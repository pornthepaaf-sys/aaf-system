r=>{bq[r.p.box]=(bq[r.p.box]||0)+ +r.qty;bx[r.p.box]=(bx[r.p.box]||0)+r.c;const k=sz(r.p.box);z[k]=(z[k]||0)+r.c;G+=r.c});tot[d]=bx;const dq=rs.reduce((a,r)=>a+ +r.qty,0),dc=rs.reduce((a,r)=>a+r.c,0);return `<div class='dt${i?'':' f'}'><h3>รายการ POT รอบส่งวันที่ ${fd(d)}</h3><table><tr><th>ลำดับ</th><th>ยี่ห้อ</th><th>รหัสสินค้า</th><th>ชื่อสินค้า</th><th>ลูกค้า</th><th>กล่อง</th><th class='n'>กล่อง</th><th class='n'>ลัง</th></tr>${rs.map((r,j)=>`${j==0||rs[j-1].p.grp!=r.p.grp?`<tr><td colspan='8' style='background:#eaeaea;font-weight:700'>${r.p.grp=='EV'?'รถ EV':'รถสันดาป'}</td></tr>`:''}<tr><td>${j+1}</td><td>${esc(r.p.br)}</td><td>${esc(r.p.bc||'-')}</td><td>${esc(r.p.name.split(';')[0].trim())}</td><td>${esc(r.cu||'-')}</td><td>${esc(r.p.box)}</td><td class='n'>${(+r.qty).toLocaleString()}</td><td class='n'>${f1(r.c)}</td></tr>`).join('')}<tr class='tt'><td colspan='6'>รวมรอบนี้</td><td class='n'>${dq.toLocaleString()}</td><td class='n'>${f1(dc)}</td></tr></table></div>`}).join('');const sum=sd.length?`<div><h3>1. สรุปยอดรวม แยกตามชนิดกล่อง</h3><table><tr><th>ชนิดกล่อง</th><th class='n'>ใช้ทั้งหมด (กล่อง)</th><th class='n'>กล่อง/ลัง</th><th class='n'>รวม (ลัง)</th></tr>${bl.map(b=>{const q=sd.reduce((a,d)=>a+(all.filter(s=>s.date==d&&P(s.pid)&&P(s.pid).box==b).reduce((x,s)=>x+(+s.qty||0),0)),0);const t=sd.reduce((a,d)=>a+(tot[d][b]||0),0);const ppv=pp(b)||((all.find(s=>P(s.pid)&&P(s.pid).box==b)&&P(all.find(s=>P(s.pid)&&P(s.pid).box==b).pid).per)||12);return q||t?`<tr><td>${esc(b)}</td><td class='n'><b>${q.toLocaleString()}</b></td><td class='n'>${ppv}</td><td class='n'><b>${f1(t)}</b></td></tr>`:''}).join('')}<tr class='tt'><td>รวมทั้งหมด</td><td class='n'>${sd.reduce((a,d)=>a+all.filter(s=>s.date==d).reduce((x,s)=>x+(+s.qty||0),0),0).toLocaleString()}</td><td></td><td class='n'>${f1(G)}</td></tr></table><h3>2. สรุปยอดรวม แยกตามชนิดลัง</h3><table><tr><th>ชนิดลัง</th><th class='n'>ใช้ทั้งหมด (ลัง)</th></tr>${['เล็ก','กลาง','ใหญ่'].map(k=>{const v=z[k]||0;return v?`<tr><td>ลัง${k=='พิเศษ'?'พิเศษ (MG4)':k}</td><td class='n'><b>${f1(v)}</b></td></tr>`:''}).join('')}<tr class='tt'><td>รวมทั้งหมด</td><td class='n'>${f1(Object.values(z).reduce((a,v)=>a+v,0))}</td></tr></table><div class='sg'><div>ผู้จัดทำ</div><div>ผู้ตรวจสอบ</div><div>ผู้อนุมัติ</div></div></div>`:'';$('#rb').innerHTML=`<h1>รายงานสรุปลัง–กล่องบริษัท AAF</h1><div class='m'>รอบส่ง POT เดือน ${R.ym?MN[+R.ym.slice(5)-1]+' '+(+R.ym.slice(0,4)+543):'-'} · ยี่ห้อ: ${R.b=='all'?'ทั้งหมด':esc(R.b)} · ลูกค้า: ${R.c=='all'?[...new Set(all.map(s=>s.cu||'(ไม่ระบุ)'))].map(esc).join(', ')||'-':esc(R.c)} · วันส่ง: ${sd.map(d=>fd(d)).join(', ')||'-'}</div>${sec||'<p>ไม่มีข้อมูลในช่วงที่เลือก</p>'}${sum}`}function bcu(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader;rd.onload=()=>{const p=P(id);p.img=rd.result;save();render();bcv(id)};rd.readAsDataURL(f)};i.click()}function bcv(id){const p=P(id);let m=$('#bm');if(!m){m=document.createElement('div');m.id='bm';m.style.cssText='position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';document.body.appendChild(m)}m.innerHTML=`<div class="card" style="max-width:520px;width:100%;max-height:90vh;overflow:auto"><h2>${esc(p.name)}</h2><div style="text-align:center;background:#fff;border-radius:8px;padding:8px"><img src="${p.img.startsWith('data:')?p.img:'/ _blob/'.replace(' ','')+p.img}" alt="" style="max-width:100%;max-height:50vh"></div><div class="bar" style="margin-top:10px"><button class="p" onclick="bcd('${id}')">⬇ ดาวน์โหลด</button><button onclick="bcu('${id}')">🔄 เปลี่ยนรูป</button><button class="x" onclick="bcx('${id}')">🗑 ลบรูป</button><button onclick="$('#bm').remove()">ปิด</button></div></div>`;m.onclick=e=>{if(e.target==m)m.remove()}}async function bcd(id){const p=P(id);try{const d=await claude.use('downloads'),b=await (await fetch('/_blob/'+p.img)).blob(),ext=({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'})[b.type]||'png';if(d)await d.save({filename:`barcode-${(p.bc||p.name.split(';').pop()).trim().replace(/[^\w.-]+/g,'_')}.${ext}`,data:b})}catch(e){if(!(e&&e.code=='declined'))alert('ดาวน์โหลดไม่ได้ ลองกดค้างที่รูปแล้วเลือกบันทึกรูป')}}function bcx(id){if(!confirm('ลบรูปบาร์โค้ดนี้?'))return;const p=P(id);p.img='';save();$('#bm')?.remove();render()}$('#fy').onchange=e=>{F.y=e.target.value;render()};$('#fm').onchange=e=>{F.m=e.target.value;render()};$('#fg').onchange=e=>{F.g=e.target.value;render()};$('#fc').onchange=e=>{F.c=e.target.value;render()};$('#fb').onchange=e=>{F.b=e.target.value;render()};
